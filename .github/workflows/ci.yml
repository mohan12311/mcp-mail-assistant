name: Portfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Public-safety check
        run: python scripts/public_safety_check.py

      - name: Syntax check
        run: python -m compileall core daemon db mcp_server mail_operator parsers watcher skills tools
      - name: Run selected unit tests
        run: python -m pytest tests/test_portfolio_surface.py tests/test_config.py tests/test_smtp_adapter.py tests/test_pop3_adapter.py -k "not cmd_start and not TestPOP3SkillsIntegration"
